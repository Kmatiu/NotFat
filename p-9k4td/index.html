<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Plan de septiembre · Agustín — comer mejor sin pesar nada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   El color dice de qué dominio es cada cosa:
   azul = entrenamiento, oliva = comida, ámbar = constancia.
   ============================================================ */
:root {
  --paper: #EEF1F4;
  --card: #FFFFFF;
  --ink: #16202B;
  --ink-soft: #3D4B59;
  --ink-mute: #6E7C8A;
  --line: #D6DCE3;
  --line-soft: #E6EBEF;

  --train: #2547D0;
  --train-wash: #E7EBFB;
  --eat: #4C6B3C;
  --eat-wash: #E8EEE4;
  --streak: #E0A100;
  --streak-wash: #FBF0D5;
  --stop: #B03A2E;
  --stop-wash: #F7E5E2;

  --accent: var(--train);
  --accent-ink: #FFFFFF;

  --display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  --r-s: 6px;
  --r: 12px;
  --r-l: 20px;

  --fs: 1;
  --tab-h: calc(62px * var(--fs));
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  --ease: 180ms cubic-bezier(.4, 0, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: calc(16px * var(--fs));
  line-height: 1.5;
  padding-bottom: calc(var(--tab-h) + var(--bot));
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

h1, h2, h3, .num {
  font-family: var(--display);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  margin: 0;
}
h1 { font-size: calc(30px * var(--fs)); font-weight: 800; line-height: 1.1; }
h2 { font-size: calc(21px * var(--fs)); font-weight: 700; line-height: 1.2; }
h3 { font-size: calc(16px * var(--fs)); font-weight: 700; }
p { margin: 0 0 12px; max-width: 70ch; }
p:last-child { margin-bottom: 0; }
a { color: var(--train); }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--train); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ============================================================
   ESTRUCTURA
   ============================================================ */
.top {
  position: sticky; top: 0; z-index: 40;
  padding: calc(var(--top) + 12px) 18px 10px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(10px);
  border-bottom: 1px solid var(--line-soft);
}
.top__row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top__date { font-family: var(--display); font-weight: 700; font-size: calc(17px * var(--fs)); }
.top__week { color: var(--ink-mute); font-size: calc(13px * var(--fs)); font-variant-numeric: tabular-nums; }

.page { display: none; padding: 18px 18px 32px; }
.page.is-on { display: block; animation: fade var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; align-items: stretch;
  height: calc(var(--tab-h) + var(--bot));
  padding-bottom: var(--bot);
  background: var(--card);
  border-top: 1px solid var(--line);
}
.tabs__b {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: calc(11px * var(--fs)); font-weight: 600; color: var(--ink-mute);
  position: relative; transition: color var(--ease);
}
.tabs__b svg { width: 21px; height: 21px; }
.tabs__b.is-on { color: var(--ink); }
.tabs__b.is-on::before {
  content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 3px;
  background: var(--accent); border-radius: 0 0 3px 3px;
}
.tabs__b[data-tab="eat"].is-on::before { background: var(--eat); }
.tabs__b[data-tab="eat"].is-on { color: var(--eat); }
.tabs__b[data-tab="train"].is-on::before { background: var(--train); }
.tabs__b[data-tab="train"].is-on { color: var(--train); }

/* ============================================================
   PIEZAS
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 14px;
}
.card--flat { background: transparent; border-style: dashed; }
.card__h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }

.sec { margin: 26px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec:first-child { margin-top: 0; }
.sec__n { color: var(--ink-mute); font-size: calc(13px * var(--fs)); font-variant-numeric: tabular-nums; }

.mute { color: var(--ink-mute); }
.small { font-size: calc(14px * var(--fs)); }
.tiny { font-size: calc(12.5px * var(--fs)); }
.hint { color: var(--ink-mute); font-size: calc(13.5px * var(--fs)); line-height: 1.45; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px;
  border-radius: var(--r); border: 1px solid var(--ink);
  background: var(--ink); color: #fff; font-weight: 700; font-size: calc(15px * var(--fs));
  transition: transform var(--ease), opacity var(--ease);
}
.btn:active { transform: scale(.98); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn--train { background: var(--train); border-color: var(--train); }
.btn--eat { background: var(--eat); border-color: var(--eat); }
.btn--stop { background: transparent; color: var(--stop); border-color: var(--stop); }
.btn--wide { width: 100%; }
.btn--s { min-height: 38px; padding: 0 12px; font-size: calc(14px * var(--fs)); border-radius: var(--r-s); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--line-soft); color: var(--ink-soft);
  font-size: calc(12.5px * var(--fs)); font-weight: 600; white-space: nowrap;
}
.chip--train { background: var(--train-wash); color: var(--train); }
.chip--eat { background: var(--eat-wash); color: var(--eat); }
.chip--streak { background: var(--streak-wash); color: #8A6400; }
.chip--stop { background: var(--stop-wash); color: var(--stop); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.banner {
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px;
  border: 1px solid var(--line);
}
.banner--propose { background: var(--streak-wash); border-color: #E8CE8A; }
.banner--pause { background: var(--stop-wash); border-color: #E2B5AE; }
.banner--view { background: var(--eat-wash); border-color: var(--eat); }
.banner h3 { margin-bottom: 4px; }
.banner p { font-size: calc(14px * var(--fs)); margin-bottom: 10px; }

/* ---- Tarjeta de la sesión de hoy: el elemento con más peso visual ---- */
.today {
  position: relative; overflow: hidden;
  background: var(--card); border: 1px solid var(--line);
  border-left: 5px solid var(--train);
  border-radius: var(--r); padding: 18px; margin-bottom: 14px;
}
.today--rest { border-left-color: var(--ink-mute); }
.today--eat { border-left-color: var(--eat); }
.today__kicker { font-size: calc(12.5px * var(--fs)); font-weight: 700; color: var(--train); margin-bottom: 6px; }
.today--rest .today__kicker { color: var(--ink-mute); }
.today__name { font-family: var(--display); font-size: calc(27px * var(--fs)); font-weight: 800; line-height: 1.08; letter-spacing: -.03em; }
.today__meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.today__actions { margin-top: 14px; display: flex; gap: 10px; }
.today.is-done { border-left-color: var(--eat); }

.stamp {
  position: absolute; top: 14px; right: 12px;
  transform: rotate(-11deg);
  border: 3px solid var(--eat); color: var(--eat);
  border-radius: 8px; padding: 4px 10px;
  font-family: var(--display); font-weight: 800; font-size: calc(15px * var(--fs)); letter-spacing: .02em;
  opacity: .92;
}
.stamp--in { animation: stamp 320ms cubic-bezier(.2, 1.6, .4, 1); }
@keyframes stamp {
  0%   { transform: rotate(-11deg) scale(2.4); opacity: 0; }
  60%  { transform: rotate(-11deg) scale(.94); opacity: 1; }
  100% { transform: rotate(-11deg) scale(1); opacity: .92; }
}

/* ---- Racha: una tira de días, no una llama ---- */
.streak { display: flex; align-items: center; gap: 10px; }
.streak__bars { display: flex; gap: 3px; }
.streak__d {
  width: 9px; height: 22px; border-radius: 2px;
  background: var(--line); 
}
.streak__d.is-full { background: var(--streak); }
.streak__d.is-half { background: linear-gradient(to top, var(--streak) 50%, var(--line) 50%); }
.streak__d.is-today { box-shadow: inset 0 0 0 2px var(--ink); }
.streak__n { font-family: var(--display); font-weight: 800; font-size: calc(19px * var(--fs)); }

/* ---- Registro diario ---- */
.log__row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-soft);
}
.log__row:last-child { border-bottom: 0; }
.log__label { font-size: calc(15px * var(--fs)); font-weight: 600; }
.log__sub { font-size: calc(12.5px * var(--fs)); color: var(--ink-mute); font-weight: 400; }

.tri { display: flex; gap: 4px; }
.tri__b {
  min-width: 42px; height: 34px; border-radius: var(--r-s);
  border: 1px solid var(--line); background: var(--card);
  font-size: calc(13px * var(--fs)); font-weight: 700; color: var(--ink-mute);
}
.tri__b.is-on[data-v="si"] { background: var(--eat); border-color: var(--eat); color: #fff; }
.tri__b.is-on[data-v="parcial"] { background: var(--streak); border-color: var(--streak); color: #3A2C00; }
.tri__b.is-on[data-v="no"] { background: var(--line); border-color: var(--line); color: var(--ink-soft); }

.dots { display: flex; gap: 7px; }
.dots__d {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--card);
}
.dots__d.is-on { background: var(--ink); border-color: var(--ink); }

.stepper { display: flex; align-items: center; gap: 6px; }
.stepper__b {
  width: 34px; height: 34px; border-radius: var(--r-s);
  border: 1px solid var(--line); background: var(--card);
  font-size: calc(19px * var(--fs)); font-weight: 700; line-height: 1; color: var(--ink-soft);
}
.stepper__v { min-width: 58px; text-align: center; font-family: var(--display); font-weight: 700; font-size: calc(17px * var(--fs)); }

.field {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--r-s);
  background: var(--card); font-size: calc(16px * var(--fs));
}
textarea.field { min-height: 76px; resize: vertical; line-height: 1.45; }
.field:focus { border-color: var(--train); outline: none; }
label.lbl { display: block; font-size: calc(13px * var(--fs)); font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }

/* ---- Comida ---- */
.meal { border-bottom: 1px solid var(--line-soft); padding: 14px 0; }
.meal:last-child { border-bottom: 0; padding-bottom: 0; }
.meal__h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.meal__name { font-family: var(--display); font-weight: 700; font-size: calc(17px * var(--fs)); }
.meal__time { font-size: calc(12.5px * var(--fs)); color: var(--ink-mute); font-variant-numeric: tabular-nums; }
.opt {
  display: block; width: 100%; text-align: left;
  border: 1px solid var(--line); border-radius: var(--r-s);
  padding: 11px 12px; margin-top: 8px; background: var(--card);
}
.opt.is-picked { border-color: var(--eat); background: var(--eat-wash); }
.opt__t { font-weight: 700; font-size: calc(15px * var(--fs)); }
.opt__d { font-size: calc(13.5px * var(--fs)); color: var(--ink-soft); margin-top: 3px; }
.opt__m { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }

.ration {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px;
  background: var(--eat-wash); color: #2F4626;
  font-size: calc(12px * var(--fs)); font-weight: 700; font-variant-numeric: tabular-nums;
}

.guide { display: grid; grid-template-columns: 1fr; gap: 0; }
.guide__r { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.guide__r:last-child { border-bottom: 0; }
.guide__i { font-size: calc(22px * var(--fs)); line-height: 1.2; width: 30px; flex: none; text-align: center; }
.guide__g { font-weight: 700; font-size: calc(15px * var(--fs)); }
.guide__m { font-size: calc(13.5px * var(--fs)); color: var(--ink-soft); }
.guide__e { font-size: calc(12.5px * var(--fs)); color: var(--ink-mute); margin-top: 2px; }

/* ---- Ejercicios ---- */
.ex { border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px; background: var(--card); overflow: hidden; }
.ex__h { display: flex; align-items: center; gap: 12px; padding: 13px 14px; width: 100%; text-align: left; }
.ex__n { flex: 1; }
.ex__name { font-weight: 700; font-size: calc(15.5px * var(--fs)); line-height: 1.25; }
.ex__pre { font-size: calc(13px * var(--fs)); color: var(--ink-mute); font-variant-numeric: tabular-nums; margin-top: 2px; }
.ex__mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: calc(13px * var(--fs)); color: transparent; }
.ex__mark.is-on { background: var(--train); border-color: var(--train); color: #fff; }
.ex__body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line-soft); }
.ex.is-open .ex__body { display: block; }
.sets { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.set {
  display: flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); border-radius: var(--r-s); padding: 5px 7px;
}
.set__n { font-size: calc(12px * var(--fs)); font-weight: 700; color: var(--ink-mute); width: 14px; }
.set input { width: 52px; text-align: center; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: calc(15px * var(--fs)); font-variant-numeric: tabular-nums; padding: 2px 0; }
.set input:focus { outline: none; border-bottom-color: var(--train); }
.cues { margin: 10px 0 0; padding-left: 18px; font-size: calc(13.5px * var(--fs)); color: var(--ink-soft); }
.cues li { margin-bottom: 4px; }
.swap { margin-top: 10px; font-size: calc(13.5px * var(--fs)); color: var(--ink-soft); background: var(--line-soft); padding: 9px 11px; border-radius: var(--r-s); }
.lastload { font-size: calc(12.5px * var(--fs)); color: var(--train); font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }

/* ---- Semana ---- */
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 6px; }
.wk__d {
  aspect-ratio: 1 / 1.25; border: 1px solid var(--line); border-radius: var(--r-s);
  background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: calc(11px * var(--fs)); color: var(--ink-mute); padding: 2px;
  font-family: inherit; width: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform .12s ease, box-shadow .12s ease;
}
.wk__d:active { transform: scale(.94); }
.wk__d.is-train { border-color: var(--train); background: var(--train-wash); color: var(--train); }
.wk__d.is-rest { background: var(--line-soft); }
.wk__d.is-today { box-shadow: inset 0 0 0 2px var(--ink); }
.wk__d.is-done::after { content: '✓'; font-size: calc(13px * var(--fs)); font-weight: 800; color: var(--eat); }
.wk__d.is-view { box-shadow: inset 0 0 0 2px var(--eat); }
.wk__d.is-future { opacity: .45; }
.wk__hint { font-size: calc(12.5px * var(--fs)); color: var(--ink-mute); margin: 2px 0 10px; }
.wk__n { font-family: var(--display); font-weight: 700; font-size: calc(15px * var(--fs)); color: var(--ink); }

.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar__f { height: 100%; background: var(--train); border-radius: 999px; }
.bar__f--eat { background: var(--eat); }

.trend { display: flex; align-items: flex-end; gap: 3px; height: 54px; margin: 10px 0 6px; }
.trend__b { flex: 1; background: var(--train-wash); border-radius: 2px 2px 0 0; min-height: 3px; }
.trend__b.is-last { background: var(--train); }

/* ---- Logros ---- */
.ach { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); opacity: .45; }
.ach:last-child { border-bottom: 0; }
.ach.is-got { opacity: 1; }
.ach__i { font-size: calc(24px * var(--fs)); width: 34px; text-align: center; flex: none; }
.ach__t { font-weight: 700; font-size: calc(15px * var(--fs)); }
.ach__d { font-size: calc(13px * var(--fs)); color: var(--ink-mute); }

/* ---- Utilidades ---- */
.acc { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); margin-bottom: 10px; }
.acc__h { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px; text-align: left; font-weight: 700; font-size: calc(15.5px * var(--fs)); }
.acc__h span.acc__i { font-size: calc(19px * var(--fs)); }
.acc__c { display: none; padding: 0 14px 14px; }
.acc.is-open .acc__c { display: block; }
.acc__ar { margin-left: auto; color: var(--ink-mute); transition: transform var(--ease); }
.acc.is-open .acc__ar { transform: rotate(90deg); }

.list { margin: 0; padding-left: 20px; font-size: calc(14.5px * var(--fs)); color: var(--ink-soft); }
.list li { margin-bottom: 6px; }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: calc(14.5px * var(--fs)); }
.kv:last-child { border-bottom: 0; }
.kv__v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--bot) + 16px);
  transform: translateX(-50%) translateY(12px);
  background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px;
  font-size: calc(14px * var(--fs)); font-weight: 600; z-index: 90; opacity: 0; pointer-events: none;
  transition: opacity var(--ease), transform var(--ease); max-width: 88vw; text-align: center;
}
.toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }

.sheet { position: fixed; inset: 0; z-index: 80; display: none; }
.sheet.is-on { display: block; }
.sheet__bg { position: absolute; inset: 0; background: rgba(22,32,43,.45); }
.sheet__c {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 88vh; overflow-y: auto;
  background: var(--paper); border-radius: var(--r-l) var(--r-l) 0 0;
  padding: 20px 18px calc(24px + var(--bot));
}
.sheet__t { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

.empty { text-align: center; padding: 34px 18px; color: var(--ink-mute); font-size: calc(14.5px * var(--fs)); }

@media print {
  .tabs, .top, .btn, .tri, .dots, .stepper { display: none !important; }
  .page { display: block !important; }
  body { background: #fff; padding: 0; }
}

/* ── Tamaño del texto ──────────────────────────────────────────────────────────
   El botón «Aa» de la cabecera multiplica --fs, y de ahí cuelga toda la
   tipografía del panel. Sus propias medidas van en píxeles fijos: si creciera
   con el ajuste, a partir del segundo nivel echaría la fecha fuera de la
   cabecera. La marca de nivel son los tres puntitos de debajo. */
.top__tools { display: flex; align-items: center; gap: 14px; flex: none; align-self: center; }
/* La fecha cede espacio antes que desbordar la cabecera en pantallas estrechas. */
.top__row > div:first-child { min-width: 0; }
.aa {
  flex: none; position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 46px; height: 36px; padding: 0 10px 5px;
  border: 1px solid var(--line); border-radius: var(--r-s);
  background: var(--card); color: var(--ink-soft);
  font-family: var(--display); font-weight: 800; line-height: 1;
  letter-spacing: -0.01em;
  cursor: pointer; -webkit-tap-highlight-color: transparent;

    "flexibility": "Cumplir cuatro días de cada cinco es un plan cumplido, y con eso basta para que esto funcione. No hay alimentos prohibidos aquí dentro: el arroz, la pasta y la pizza están en el plan porque te gustan y porque un plan sin lo que te gusta dura tres semanas. Una comida fuera de lo previsto no se arregla luego con nada: ni saltándose la siguiente, ni con una cena más corta, ni andando de más. Lo que toca después de un día raro es sencillamente el día siguiente, tal como estaba escrito. Los rangos de raciones existen justo para eso: un día de cinco raciones de verdura y otro de tres siguen siendo la misma semana. Y si una semana entera se tuerce por trabajo o por lo que sea, el botón de pausa del panel está ahí para usarlo sin dar explicaciones a nadie.",

  return '<span class="ration">' + rationIcon(group) + ' ' + fmt(n) + ' ' + esc(RATION_NAME[group] || group) + '</span>';
}
function rationsHTML(rations) {
  if (!rations) return '';
  return Object.keys(rations).filter(function (k) { return rations[k]; })
    .map(function (k) { return rationChip(k, rations[k]); }).join(' ');
}
/* Qué comidas tocan ese día y qué opción está sugerida. */
function mealsOfDay(pd) {
  var out = {};
  var todas = (DATA.nutrition && DATA.nutrition.meals) || [];
  if (!todas.length) return out;
  var plan = (pd && pd.meal_plan) || null;
  todas.forEach(function (m) {
    if (plan && !(m.id in plan)) return;
    out[m.id] = plan ? plan[m.id] : (m.options[0] && m.options[0].id);
  });
  return out;
}
function pickedOption(date, mealId, sugerida) {
  var d = STATE.days[date] || {};
  return (d.picks && d.picks[mealId]) || sugerida;
}

function rowStepper(label, sub, key, val, step, min, max) {
  return '<div class="log__row">' +
    '<div><div class="log__label">' + label + '</div><div class="log__sub">' + sub + '</div></div>' +
    '<div class="stepper" data-step="' + key + '" data-inc="' + step + '" data-min="' + min + '" data-max="' + max + '">' +
      '<button class="stepper__b" data-dir="-1" aria-label="Menos">−</button>' +
      '<span class="stepper__v">' + fmt(val) + '</span>' +
      '<button class="stepper__b" data-dir="1" aria-label="Más">+</button>' +
    '</div></div>';
}
function rowDots(label, sub, key, val) {
  var d = '';
  for (var i = 1; i <= 5; i++) d += '<button class="dots__d' + (val >= i ? ' is-on' : '') + '" data-n="' + i + '" aria-label="' + i + ' de 5"></button>';
  return '<div class="log__row">' +
    '<div><div class="log__label">' + label + '</div><div class="log__sub">' + sub + '</div></div>' +
    '<div class="dots" data-dots="' + key + '">' + d + '</div></div>';
}

/* La sesión se abre en una hoja, para poder entrenar sin perder el sitio. */
function openSession(id, date) {
  var s = sessionById(id); if (!s) return;
  date = date || activeDate();
  var log = (STATE.days[date] && STATE.days[date].training) || {};
  var reg = log.exercises || {};
  var h = '';
  if ((s.warmup || (DATA.training && DATA.training.warmup) || []).length) {
    var w = s.warmup || DATA.training.warmup;
    h += '<div class="card"><h3>Calentamiento</h3><ol class="list" style="margin-top:8px">' +
      w.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
  }
  (s.blocks || []).forEach(function (b) {
    h += '<div class="sec"><h2>' + esc(b.name) + '</h2>' +
      (b.type && b.type !== 'normal' ? '<span class="chip chip--train">' + esc(b.type) + '</span>' : '') + '</div>';
    (b.exercises || []).forEach(function (x) {
      var r = reg[x.id] || {};
      var hechas = (r.sets || []).filter(function (v) { return v && (v.reps || v.load); }).length;
      var ultima = lastLoad(x.id, date);

function lastLoad(exId, before) {
  var fechas = Object.keys(STATE.days).filter(function (f) { return f < before; }).sort().reverse();
  for (var i = 0; i < fechas.length; i++) {
    var r = ((STATE.days[fechas[i]].training || {}).exercises || {})[exId];
    if (r && r.sets) {
      var cargas = r.sets.filter(function (s) { return s && s.load; }).map(function (s) { return s.load; });
      if (cargas.length) return cargas.join(' · ');
    }
  }
  return '';
}

async function cifrar(objeto, frase) {
  var enc = new TextEncoder();
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var base = await crypto.subtle.importKey('raw', enc.encode(frase), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 210000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(objeto)));
  var b64 = function (b) { return btoa(String.fromCharCode.apply(null, new Uint8Array(b))); };
  return { v: 1, alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: 210000, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}

}
function importBackup() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = function () {
    var f = inp.files && inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var b;
      try { b = JSON.parse(rd.result); } catch (e) { toast('Ese archivo no es una copia válida.'); return; }
      if (!b.days || !b.kv) { toast('Ese archivo no es una copia de este plan.'); return; }
      if (!confirm('Se va a sustituir todo lo que tienes registrado en este dispositivo por el contenido de la copia. ¿Seguimos?')) return;
      Promise.all([dbClear('days'), dbClear('kv')]).then(function () {
        var ps = [];
        Object.keys(b.days).forEach(function (k) { ps.push(dbPut('days', b.days[k])); });
        Object.keys(b.kv).forEach(function (k) { ps.push(dbPut('kv', { k: k, v: b.kv[k] })); });
        return Promise.all(ps);
      }).then(loadState).then(function () { renderAll(); toast('Copia restaurada.'); });
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ============================================================
   SIN COBERTURA
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
function precacheForOffline(btn) {
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) {
    alert('Para funcionar sin cobertura, el plan tiene que abrirse desde su enlace web (https), no como archivo descargado. Si acabas de abrirlo, recárgalo una vez y vuelve a intentarlo.');
    return;
  }
  var urls = ['./', './index.html'];
  var css = document.querySelector('link[href*="fonts.googleapis"]');
  if (css) urls.push(css.href);
  var etiqueta = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Preparando…'; }

  var ch = new MessageChannel();
  var cerrado = false;
  function terminar(msg) {
    if (cerrado) return;
    cerrado = true;
    if (btn) { btn.disabled = false; btn.textContent = etiqueta; }
    toast(msg);
  }
  ch.port1.onmessage = function (ev) {
    var d = ev.data || {};
    if (!d.finished) {
      if (btn && d.total) btn.textContent = 'Preparando… ' + d.done + '/' + d.total;
      return;
    }
    terminar(d.failed ? 'Se ha preparado a medias. Conviene repetirlo con wifi.'
                      : 'Listo: el plan ya se abre sin cobertura.');
  };
  navigator.serviceWorker.controller.postMessage({ type: 'PRECACHE', urls: urls }, [ch.port2]);
  setTimeout(function () { terminar('Está tardando de más. Mejor repetirlo con wifi.'); }, 25000);
}

/* ============================================================
   EVENTOS
   ============================================================ */
function goTab(tab) {
  els('.page').forEach(function (p) { p.classList.remove('is-on'); });
  var pg = el('#page-' + tab); if (pg) pg.classList.add('is-on');
  els('.tabs__b').forEach(function (b) { b.classList.toggle('is-on', b.dataset.tab === tab); });
  window.scrollTo(0, 0);
}
els('.tabs__b').forEach(function (b) {
  b.addEventListener('click', function () { goTab(b.dataset.tab); });
});

document.addEventListener('click', function (ev) {
  var t = ev.target;

  var goday = t.closest('[data-goday]');
  if (goday) { setViewDate(goday.dataset.goday); return; }

  if (t.closest('#btn-back-today')) { setViewDate(null); return; }

  var close = t.closest('[data-close]');
  if (close) { closeSheet(); return; }

  var accH = t.closest('.acc__h');
  if (accH) { accH.parentNode.classList.toggle('is-open'); return; }

  var open = t.closest('[data-open-session]');
  if (open) { openSession(open.dataset.openSession); return; }

  var rec = t.closest('[data-recipe]');
  if (rec && rec.dataset.recipe) { openRecipe(rec.dataset.recipe); return; }

  var meal = t.closest('[data-meal]');
  if (meal) { openMealPicker(meal.dataset.meal); return; }

  var pick = t.closest('[data-pick]');
  if (pick) {
    var p = pick.dataset.pick.split('|');
    var picks = {}; picks[p[0]] = p[1];
    saveDayLog(activeDate(), { picks: picks }).then(function () { closeSheet(); renderToday(); });
    return;
  }

  var tri = t.closest('[data-meal-state] .tri__b');
  if (tri) {
    if (isFuture(activeDate())) { toast('Ese día todavía no ha llegado.'); return; }
    var mid = tri.closest('[data-meal-state]').dataset.mealState;
    var m = {}; m[mid] = tri.dataset.v;
    els('.tri__b', tri.parentNode).forEach(function (b) { b.classList.toggle('is-on', b === tri); });
    saveDayLog(activeDate(), { meals: m }).then(function () { renderTop(); });
    return;
  }

  var pain = t.closest('[data-pain] .tri__b');
  if (pain) {
    els('.tri__b', pain.parentNode).forEach(function (b) { b.classList.toggle('is-on', b === pain); });
    saveDayLog(el('#sheet-body').dataset.date || activeDate(), { training: { pain: pain.dataset.v === 'si' } });
    if (pain.dataset.v === 'si') {
      toast('Si el dolor no es agujetas, mejor no forzar y consultarlo.');
    }
    return;
  }

  var stepB = t.closest('.stepper__b');
  if (stepB) {
    var wrap = stepB.closest('.stepper');
    var key = wrap.dataset.step, inc = parseFloat(wrap.dataset.inc) * parseInt(stepB.dataset.dir, 10);
    var vEl = el('.stepper__v', wrap);
    var val = num(vEl.textContent) || 0;
    val = Math.max(parseFloat(wrap.dataset.min), Math.min(parseFloat(wrap.dataset.max), Math.round((val + inc) * 100) / 100));
    vEl.textContent = fmt(val);
    var date = wrap.dataset.scope === 'training' ? (el('#sheet-body').dataset.date || activeDate()) : activeDate();
    var patch = {};
    if (wrap.dataset.scope === 'training') { patch.training = {}; patch.training[key] = val; }
    else { patch[key] = val; }
    saveDayLog(date, patch).then(renderTop);
    return;
  }

  var dot = t.closest('.dots__d');
  if (dot) {
    var dwrap = dot.closest('.dots'), n = parseInt(dot.dataset.n, 10);
    els('.dots__d', dwrap).forEach(function (b, i) { b.classList.toggle('is-on', i < n); });
    var pd = {}; pd[dwrap.dataset.dots] = n;
    saveDayLog(activeDate(), pd).then(renderTop);
    return;
  }

  var exH = t.closest('[data-toggle-ex]');
  if (exH) { exH.closest('.ex').classList.toggle('is-open'); return; }

  if (t.closest('#btn-done') || t.closest('#btn-done-sheet')) {
    var dt = el('#sheet-body').dataset.date || activeDate();
    if (isFuture(dt)) { toast('Ese día todavía no ha llegado.'); return; }
    var yaHecho = !!((STATE.days[dt] || {}).training || {}).done;
    saveDayLog(dt, { training: { done: !yaHecho } }).then(function () {
      renderAll();
      if (!yaHecho) {
        var card = el('#today-card');
        if (card && !el('.stamp', card)) {
          var s = document.createElement('div');
          s.className = 'stamp stamp--in'; s.textContent = 'HECHO';
          card.appendChild(s);
        }
        toast('Sesión hecha. Bien.');
      }
      if (t.closest('#btn-done-sheet')) closeSheet();
    });
    return;
  }

  if (t.closest('#btn-approve')) { approvePlan(); return; }
  if (t.closest('#btn-revise')) { requestRevision(); return; }
  if (t.closest('#btn-pause') || t.closest('#btn-resume')) { pausePlan(); return; }
  if (t.closest('#btn-measures') || t.closest('#btn-measures-2')) { openMeasures(); return; }
  if (t.closest('#btn-checkin') || t.closest('#btn-checkin-2')) { exportCheckin(); return; }
  if (t.closest('#btn-backup')) { exportBackup(); return; }
  if (t.closest('#btn-restore')) { importBackup(); return; }
  if (t.closest('#btn-offline')) { precacheForOffline(t.closest('#btn-offline')); return; }

  if (t.closest('#btn-save-measures')) {
    var ms = getKV('measures', []).filter(function (x) { return x.date !== todayISO(); });
    ms.push({
      date: todayISO(),
      weight_kg: num(el('#m-w').value),
      waist_cm: num(el('#m-c').value),
      hip_cm: num(el('#m-h').value)
    });
    setKV('measures', ms).then(function () { closeSheet(); renderMe(); toast('Medidas guardadas.'); });
    return;
  }

  if (t.closest('#btn-confirm-pause')) {
    setKV('pause', {
      since: todayISO(),
      why: el('#pause-why').value,
      zone: el('#pause-zone').value,
      reason: el('#pause-note').value
    }).then(function () { closeSheet(); renderAll(); toast('Plan en pausa. Cuídate.'); });
    return;
  }

  if (t.closest('#btn-send-revision')) {
    var cambios = [];
    [['entrenamiento', 'rev-train'], ['comida', 'rev-eat'], ['otros', 'rev-other']].forEach(function (p) {
      var v = (el('#' + p[1]).value || '').trim();
      if (v) cambios.push({ ambito: p[0], que: v });
    });
    if (!cambios.length) { toast('Escribe primero qué quieres cambiar.'); return; }
    download('revision-' + (META.user_code || 'plan') + '-' + todayISO() + '.json', JSON.stringify({
      revision_version: '1.0',
      user_code: META.user_code || 'anon',
      plan_version: META.plan_version || 1,
      generado_el: new Date().toISOString(),
      decision: 'cambios', cambios: cambios, comentario: ''
    }, null, 2));
    closeSheet();
    toast('Archivo listo. Envíalo por donde te llegó el plan.');
    return;
  }

  if (t.closest('#btn-ci-plain')) {
    setKV('week_feedback', el('#ci-feedback').value || '');
    var obj = checkinObject();
    obj.feedback = el('#ci-feedback').value || '';
    download('checkin-' + (META.user_code || 'plan') + '-' + obj.semana + '.json', JSON.stringify(obj, null, 2));
    closeSheet(); toast('Archivo listo para enviar.');
    return;
  }
  if (t.closest('#btn-ci-enc')) {
    if (!window.crypto || !crypto.subtle) { toast('Este navegador no puede cifrar. Descárgalo sin cifrar.'); return; }
    var frase = prompt('Tu frase de cifrado, la misma del cuestionario:');
    if (!frase) return;
    setKV('week_feedback', el('#ci-feedback').value || '');
    var o2 = checkinObject();
    o2.feedback = el('#ci-feedback').value || '';
    cifrar(o2, frase).then(function (blob) {
      download('checkin-' + (META.user_code || 'plan') + '-' + o2.semana + '.enc.json', JSON.stringify(blob, null, 2));
      closeSheet(); toast('Archivo cifrado listo.');
    }).catch(function () { toast('No se ha podido cifrar. Prueba sin cifrado.'); });
    return;
  }
});

document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.matches('[data-shop]')) {
    var sh = getKV('shopping', {});
    sh[t.dataset.shop] = t.checked;
    setKV('shopping', sh).then(renderEat);
    return;
  }
  if (t.matches('[data-set]')) {
    var exWrap = t.closest('.ex'), i = parseInt(t.dataset.set, 10), f = t.dataset.f;
    var date = el('#sheet-body').dataset.date || activeDate();
    var tr = (STATE.days[date] && STATE.days[date].training) || {};
    var exs = Object.assign({}, tr.exercises);
    var cur = Object.assign({ sets: [] }, exs[exWrap.dataset.ex]);
    cur.sets = (cur.sets || []).slice();
    cur.sets[i] = Object.assign({}, cur.sets[i]);
    cur.sets[i][f] = t.value;
    exs[exWrap.dataset.ex] = cur;
    saveDayLog(date, { training: { exercises: exs } });
    var hechas = cur.sets.filter(function (s) { return s && (s.reps || s.load); }).length;
    var mark = el('.ex__mark', exWrap);
    if (mark) mark.classList.toggle('is-on', hechas >= (cur.sets.length || 0));
    return;
  }
});

document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'day-note') {
    clearTimeout(t._save);
    t._save = setTimeout(function () { saveDayLog(activeDate(), { note: t.value }); }, 700);
  }
  if (t.id === 'ses-note') {
    clearTimeout(t._save);
    t._save = setTimeout(function () {
      saveDayLog(el('#sheet-body').dataset.date || activeDate(), { training: { note: t.value } });
    }, 700);
  }
});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') closeSheet();
});

/* ============================================================
   ARRANQUE
   ============================================================ */
function renderAll() {
  renderTop();
  renderToday();
  renderWeek();
  renderEat();
  renderTrain();
  renderMe();
  els('.tabs__b').forEach(function (b) {
    if (b.dataset.tab === 'eat') b.hidden = !HAS_EAT;
    if (b.dataset.tab === 'train') b.hidden = !HAS_TRAIN;
  });
}

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});


/* ============================================================
   TAMAÑO DEL TEXTO
   Tres niveles para quien no ve bien de cerca. El factor vive en la variable
   CSS --fs y multiplica todos los tamaños del panel de una vez. La preferencia
   se guarda con el resto del estado, así que sobrevive a cerrar la aplicación.
   ============================================================ */
var TEXT_STEPS = [
  { fs: 1,    label: 'normal' },
  { fs: 1.18, label: 'grande' },
  { fs: 1.38, label: 'muy grande' }
];
function applyTextSize(i, avisar) {
  var n = parseInt(i, 10) || 0;
  if (n < 0 || n >= TEXT_STEPS.length) n = 0;
  var paso = TEXT_STEPS[n];
  document.documentElement.style.setProperty('--fs', String(paso.fs));
  var b = el('#btn-textsize');
  if (b) {
    b.dataset.lvl = String(n);
    b.setAttribute('aria-label', 'Tamaño del texto: ' + paso.label);
    b.title = 'Tamaño del texto: ' + paso.label;
  }
  if (avisar) toast('Texto ' + paso.label + '.');
}
function cycleTextSize() {
  var n = (parseInt(getKV('text_scale', 0), 10) || 0) + 1;
  if (n >= TEXT_STEPS.length) n = 0;
  applyTextSize(n, true);
  setKV('text_scale', n);
}
document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (t && t.closest && t.closest('#btn-textsize')) cycleTextSize();
});

loadState().then(function () {
  applyTextSize(getKV('text_scale', 0), false);
  renderAll();
  checkAchievements();
  /* Aviso de fin de semana: el domingo por la tarde toca preparar el envío. */
  var hoy = new Date();
  if (hoy.getDay() === 0 && hoy.getHours() >= 17 && getKV('last_checkin_prompt', '') !== todayISO()) {
    setKV('last_checkin_prompt', todayISO());
    setTimeout(function () { toast('Es domingo: toca preparar el envío de la semana.'); }, 1400);
  }
});

})();
